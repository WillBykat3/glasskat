<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glasskat</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f6f6f3; --surface: #ffffff; --ink: #1c1c1e; --ink-2: #55565c; --muted: #8e8f96;
    --line: #e4e4df; --line-2: #d3d3cd; --wall: #1c1c1e; --accent: #3b6cf6; --accent-soft: rgba(59,108,246,.14);
    --ok: #2f9e62; --bad: #e0483d; --bad-soft: rgba(224,72,61,.16); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #111113; --surface: #1a1a1d; --ink: #f2f2f4; --ink-2: #b4b5bb; --muted: #7c7d84;
    --line: #2a2a2f; --line-2: #36363c; --wall: #f2f2f4; --accent: #7c9cff; --accent-soft: rgba(124,156,255,.18);
    --ok: #5fd08f; --bad: #ff6b60; --bad-soft: rgba(255,107,96,.18); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  } }
  :root[data-theme="dark"] {
    --bg: #111113; --surface: #1a1a1d; --ink: #f2f2f4; --ink-2: #b4b5bb; --muted: #7c7d84;
    --line: #2a2a2f; --line-2: #36363c; --wall: #f2f2f4; --accent: #7c9cff; --accent-soft: rgba(124,156,255,.18);
    --ok: #5fd08f; --bad: #ff6b60; --bad-soft: rgba(255,107,96,.18); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-feature-settings: "tnum" 1, "cv11" 1;
    -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 16px 28px; -webkit-user-select: none; user-select: none; }
  .wrap { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 40px; }
  .brand { font-weight: 700; font-size: 19px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 28px; height: 28px; flex: none; color: #1c1c1e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand svg { filter: drop-shadow(0 0 .8px #f2f2f4) drop-shadow(0 0 .4px #f2f2f4); } }
  :root[data-theme="dark"] .brand svg { filter: drop-shadow(0 0 .8px #f2f2f4) drop-shadow(0 0 .4px #f2f2f4); }
  .brand span { color: var(--muted); font-weight: 500; }
  .top-right { display: flex; align-items: center; gap: 8px; position: relative; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
  .chip:hover { border-color: var(--line-2); }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center;
    font-size: 12px; font-weight: 600; margin-left: -6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .dot.saving, .dot.pending { background: #d6a43a; } .dot.error { background: var(--bad); }
  .icon-btn { width: 34px; height: 34px; padding: 0; justify-content: center; }

  /* status row */
  .status { display: flex; align-items: baseline; justify-content: space-between; }
  .level { font-size: 26px; font-weight: 700; letter-spacing: -.03em; }
  .level small { font-size: 14px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 6px; }
  .timer { font-size: 15px; color: var(--ink-2); font-weight: 500; }
  .progress { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: -6px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 3px; transition: width .3s ease; }

  /* rules */
  .rules { display: flex; flex-direction: column; gap: 6px; }
  .rule { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); min-height: 28px; }
  .rule .st { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-2); flex: none; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; color: transparent; transition: all .2s; }
  .rule.ok .st { background: var(--ok); border-color: var(--ok); color: #fff; }
  .rule.bad .st { background: var(--bad); border-color: var(--bad); color: #fff; }
  .rule.ok { color: var(--ink); }
  .rule .shapes { display: inline-flex; gap: 8px; align-items: center; margin-left: 2px; }
  .rule canvas { display: block; }

  /* board */
  .board-card { display: grid; place-items: center; padding: 6px 0; }
  #board { display: block; touch-action: none; max-width: 100%; }
  #board.lines { cursor: crosshair; } #board.boxes { cursor: pointer; }

  /* toolbar */
  .tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 14px; font-weight: 500;
    height: 32px; padding: 0 14px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg svg { width: 15px; height: 15px; }
  .actions { display: flex; gap: 6px; }
  .btn { height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--line-2); } .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .btn svg { width: 16px; height: 16px; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; min-height: 19px; }
  .hint.bad { color: var(--bad); }
  #makePane { display: none; } #makePane.show { display: inline-flex; }
  kbd { font: inherit; font-size: 12px; padding: 0 5px; border: 1px solid var(--line-2); border-radius: 4px; color: var(--ink-2); }

  /* modal + popover */
  .scrim { position: fixed; inset: 0; background: rgba(10,10,12,.38); display: grid; place-items: center; z-index: 20; padding: 16px;
    animation: fade .18s ease; }
  .card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 24px; width: 100%; max-width: 360px; }
  .card h3 { margin: 0 0 6px; font-size: 19px; letter-spacing: -.02em; }
  .card p { margin: 0 0 14px; color: var(--ink-2); font-size: 14px; }
  .card .fine { font-size: 12.5px; color: var(--muted); margin: 10px 0 16px; }
  .card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .card input { width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink);
    font: inherit; padding: 0 12px; outline: none; -webkit-user-select: text; user-select: text; }
  .card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .card .err { color: var(--bad); font-size: 13px; min-height: 18px; margin: 6px 0 0; }
  .card .btns { display: flex; gap: 8px; align-items: center; }
  .linkbtn { background: none; border: 0; color: var(--ink-2); font: inherit; font-size: 14px; cursor: pointer; padding: 8px; }
  .linkbtn:hover { color: var(--ink); }
  .shake { animation: shake .3s; }
  .solved { text-align: center; }
  .solved .big { font-size: 40px; font-weight: 700; letter-spacing: -.03em; margin: 2px 0 4px; }
  .solved .save-line { font-size: 13px; color: var(--muted); min-height: 18px; margin: 4px 0 16px; }
  .solved .save-line.good { color: var(--ok); } .solved .save-line.bad { color: var(--bad); }
  .solved .btns { justify-content: center; }

  .pop { position: absolute; right: 0; top: 42px; width: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 16px; z-index: 15; animation: fade .15s ease; }
  .pop h4 { margin: 0; font-size: 16px; }
  .pop .sub { margin: 2px 0 12px; font-size: 12.5px; color: var(--muted); }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stats3 div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
  .stats3 span { display: block; font-size: 11.5px; color: var(--muted); }
  .stats3 b { font-size: 17px; }
  .mini { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .list { list-style: none; margin: 0 0 14px; padding: 0; font-size: 13.5px; max-height: 160px; overflow: auto; }
  .list li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .list small { color: var(--muted); }
  .list .me { font-weight: 600; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--surface);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (max-width: 420px) { .seg button span.lbl-long { display: none; } .level { font-size: 23px; } .btn { padding: 0 11px; } }
  /* level title + picker */
  .level-btn { background: none; border: 0; padding: 0; font-family: inherit; color: inherit; cursor: pointer; text-align: left; display: flex; align-items: baseline; gap: 8px; }
  .level-btn:hover .chev { color: var(--ink); }
  .chev { color: var(--muted); font-size: 16px; font-weight: 500; letter-spacing: 0; }
  .chapter { font-size: 13px; color: var(--muted); font-weight: 500; margin-top: -10px; }
  .levels-card { max-width: 440px; max-height: min(86vh, 760px); overflow: auto; }
  .levels-card .chap { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 8px; }
  .levels-card .chap:first-of-type { margin-top: 6px; }
  .levels-card .chap b { font-size: 14px; } .levels-card .chap small { color: var(--muted); font-size: 12.5px; }
  .lv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .lv { height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit;
    font-size: 15px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .lv small { font-size: 10.5px; font-weight: 500; color: var(--muted); }
  .lv.solved { background: var(--bg); }
  .lv.solved small { color: var(--ok); }
  .lv.current { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .lv:disabled { color: var(--line-2); cursor: default; background: transparent; }
  .lv:not(:disabled):hover { border-color: var(--line-2); }
  .overall { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin: -2px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <defs><clipPath id="gk-win"><rect x="7" y="17" width="50" height="41" rx="10"/></clipPath></defs>
      <path d="M12.5 21 17 6.5c.4-1.3 2.1-1.6 2.9-.5L28 17" fill="#ffd9d2" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M51.5 21 47 6.5c-.4-1.3-2.1-1.6-2.9-.5L36 17" fill="#ffd9d2" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
      <g clip-path="url(#gk-win)"><rect x="7" y="17" width="23" height="21" fill="#cfe3ff"/><rect x="30" y="17" width="27" height="21" fill="#fff0bf"/><rect x="7" y="38" width="35" height="20" fill="#d5f2dc"/><rect x="42" y="38" width="15" height="20" fill="#e6dcff"/></g>
      <path d="M30 17v21M7 38h50M42 38v20" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <rect x="7" y="17" width="50" height="41" rx="10" stroke="currentColor" stroke-width="3.2"/>
    </svg><div>glass<span>kat</span></div></div>
    <div class="top-right">
      <button class="chip icon-btn" id="levelsBtn" title="All levels" aria-label="All levels">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>
      </button>
      <button class="chip icon-btn" id="themeBtn" title="Switch light / dark" aria-label="Switch light or dark theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
      </button>
      <span id="acctWrap" hidden><button class="chip" id="acctBtn" aria-haspopup="true" aria-expanded="false"></button>
        <div class="pop" id="acctPop" hidden></div></span>
    </div>
  </div>

  <div class="status">
    <button class="level level-btn" id="levelTitle" title="All levels">Level <span id="lvl">1</span><small id="sq"></small><span class="chev">▾</span></button>
    <div class="timer" id="timer">0:00</div>
  </div>
  <div class="chapter" id="chapter"></div>
  <div class="progress"><i id="bar"></i></div>

  <div class="rules" id="rules"></div>

  <div class="board-card"><canvas id="board" class="boxes"></canvas></div>
  <div class="hint" id="hint"></div>

  <div class="tools">
    <div class="seg" role="tablist" aria-label="Input mode">
      <button id="modeBoxes" class="on" title="Boxes (B)"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5" opacity=".35"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5" opacity=".35"/></svg>Boxes</button>
      <button id="modeLines" title="Lines (L)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2v12h12M8 2v6h6"/></svg>Lines</button>
    </div>
    <div class="actions">
      <button class="btn primary" id="makePane">Make pane</button>
      <button class="btn" id="hintBtn" title="Fill in one pane of the answer (H)">Hint</button>
      <button class="btn" id="undo" title="Undo (Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Undo</button>
      <button class="btn" id="clear" title="Clear your lines">Clear</button>
    </div>
  </div>
  <div class="hint" id="howto"></div>
</div>
<div id="modalSlot"></div>

<script src="core.js"></script>
<script src="levels.js"></script>
<script>
(() => {
"use strict";
/* Accounts: the web app URL of the Google Sheet script (google-sheet/Code.gs).
   Leave it empty and accounts stay hidden; the game still saves in this browser. */
const API_URL = "https://script.google.com/macros/s/AKfycbyBGny-UBelu_OCVo3IiJ4Qy5IsftYmlPs9RWgXsGkbvpzeOxylnPXXY4w0EM4d2-L4/exec";

const GK = window.GK, LEVELS = window.GK_LEVELS, TOTAL = LEVELS.length;
const { DIRS, key, unkey, normalize, canon, POLY, edgeR, edgeD, edgeBetween } = GK;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const pick = (a) => a[Math.floor(Math.random() * a.length)];

/* ================= THEME ================= */
(function theme() {
  const saved = store.get("gk-theme");
  if (saved) document.documentElement.dataset.theme = saved;
  $("#themeBtn").addEventListener("click", () => {
    const next = C.dark ? "light" : "dark";
    document.documentElement.dataset.theme = next; store.set("gk-theme", next); readColors(); buildRules(); paintRules(); draw();
  });
})();

/* ================= PROGRESS (this browser) =================
   gk-progress: { max: highest level unlocked, best: { level: seconds }, hinted: { level: true } }
   gk-drafts:   { level: { walls, elapsed, hints } }   unfinished work on each level
   gk-current:  the level on screen */
const PROG = Object.assign({ max: 1, best: {}, hinted: {} }, store.get("gk-progress") || {});
if (!store.get("gk-progress") && store.get("gk-level")) PROG.max = Math.min(TOTAL, Math.max(1, store.get("gk-level"))); // from the first version
const DRAFTS = store.get("gk-drafts") || {};
const saveProg = () => store.set("gk-progress", PROG);
const unlocked = (n) => n >= 1 && n <= Math.min(TOTAL, PROG.max);

/* ================= GAME STATE =================
   The board is a set of lines between neighbouring squares: the level's fixed lines
   plus the player's. Every connected group of squares is a region; a region that
   obeys the per-pane rules (and has no line ending inside it) is a finished pane. */
let level = 1, P = null, cells = [], cellSet = new Set(), W = 0, H = 0;
let fixed = new Set(), walls = new Set(), history = [], regions = [], regionOf = new Map(), evalState = null;
let mode = store.get("gk-mode") === "lines" ? "lines" : "boxes";
let elapsed = 0, startedAt = 0, solvedFlag = false, hints = 0, selection = [];
const isWall = (e) => walls.has(e) || fixed.has(e);
const allWalls = () => [...fixed, ...walls];
const isInner = (id) => { const [x, y, t] = id.split(","); const X = +x, Y = +y;
  return cellSet.has(key(X, Y)) && cellSet.has(t === "r" ? key(X + 1, Y) : key(X, Y + 1)); };

function computeRegions() {
  regions = []; regionOf = new Map();
  for (const [sx, sy] of cells) {
    const k0 = key(sx, sy); if (regionOf.has(k0)) continue;
    const id = regions.length, list = [], st = [[sx, sy]]; regionOf.set(k0, id);
    while (st.length) {
      const [x, y] = st.pop(); list.push([x, y]);
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy, nk = key(nx, ny);
        if (!cellSet.has(nk) || regionOf.has(nk) || isWall(edgeBetween([x, y], [nx, ny]))) continue;
        regionOf.set(nk, id); st.push([nx, ny]);
      }
    }
    regions.push(list.sort((a, b) => a[1] - b[1] || a[0] - b[0]));
  }
}
function changed(record = true) {
  computeRegions(); evalState = GK.evaluate(P, regions, regionOf, allWalls());
  if (record) { touchTimer(); persist(); }
  draw(); paintRules(); paintStatus();
  if (evalState.win && !solvedFlag) { solvedFlag = true; onSolved(); }
}
function pushHistory() { history.push([...walls]); if (history.length > 300) history.shift(); }

/* ================= LOAD ================= */
function loadLevel(n) {
  n = Math.max(1, Math.min(TOTAL, n));
  if (P && !solvedFlag) saveDraft();
  level = n; P = GK.decodeLevel(LEVELS[n - 1], n);
  cells = P.cells; cellSet = P.ctx.cellSet; fixed = new Set(P.givens);
  W = Math.max(...cells.map((c) => c[0])) + 1; H = Math.max(...cells.map((c) => c[1])) + 1;
  const d = DRAFTS[n] || {};
  walls = new Set((d.walls || []).filter((e) => isInner(e) && !fixed.has(e)));
  elapsed = d.elapsed || 0; hints = d.hints || 0; startedAt = 0;
  history = []; selection = []; solvedFlag = false; shapeColor.clear();
  store.set("gk-current", n);
  buildRules(); resize();
  const bar = $("#bar"); bar.style.transition = "none"; changed(false); void bar.offsetWidth; bar.style.transition = "";
  paintTimer(); setHint("");
}
function saveDraft() {
  if (!P) return;
  if (walls.size || hints || currentElapsed()) DRAFTS[level] = { walls: [...walls], elapsed: currentElapsed(), hints };
  else delete DRAFTS[level];
  store.set("gk-drafts", DRAFTS);
}
const snapshotState = () => ({ v: 2, level, walls: [...walls], elapsed: currentElapsed(), hints, max: PROG.max });
function persist() { saveDraft(); markDirty(); }

/* ================= TIMER ================= */
const currentElapsed = () => Math.round(elapsed + (startedAt ? (Date.now() - startedAt) / 1000 : 0));
function touchTimer() { if (!startedAt && !solvedFlag && document.visibilityState !== "hidden") startedAt = Date.now(); }
function pauseTimer() { if (startedAt) { elapsed += (Date.now() - startedAt) / 1000; startedAt = 0; } }

  const secs = currentElapsed();
  const result = { level, seconds: secs, panes: regions.length, squares: cells.length, rules: P.rules.map((r) => r.type).join("+"),
    mode: mode + (hints ? `, ${hints} hint${hints > 1 ? "s" : ""}` : "") };
  const prevBest = PROG.best[level], first = prevBest == null;
  if (first || secs < prevBest) PROG.best[level] = secs;
  PROG.max = Math.max(PROG.max, Math.min(TOTAL, level + 1));
  saveProg(); delete DRAFTS[level]; store.set("gk-drafts", DRAFTS);
  solveAnim = performance.now(); draw(); paintStatus();
  const next = level < TOTAL ? level + 1 : null;
  setTimeout(() => {
    const allDone = Object.keys(PROG.best).length >= TOTAL;
    $("#modalSlot").innerHTML = `<div class="scrim"><div class="card solved" role="dialog" aria-modal="true">
      <p style="margin:0">Level ${level} solved${hints ? ` · ${hints} hint${hints > 1 ? "s" : ""}` : ""}</p><div class="big">${fmtTime(secs)}</div>
      <p class="save-line" id="localLine">${!first && secs < prevBest ? "New best time!" : !first ? `Best: ${fmtTime(prevBest)}` : allDone ? "That's every level. Nicely done!" : ""}</p>
      <p class="save-line" id="saveLine" style="margin-top:-12px"></p>
      <div class="btns">${next ? `<button class="btn primary" id="nextBtn">Next level <kbd style="border-color:transparent;color:inherit;opacity:.6">Space</kbd></button>` : ""}
        <button class="btn" id="allBtn">All levels</button></div></div></div>`;
    if (next) $("#nextBtn").onclick = () => { $("#modalSlot").innerHTML = ""; loadLevel(next); markDirty(); };
    $("#allBtn").onclick = openLevels;
    saveResult(result);
  }, 600);
}

/* ================= ACCOUNTS (Google Sheet) ================= */
const ACC = { name: store.get("gk-user"), level: 1, solved: 0, fastest: null, status: "" };
const NAME_RE = /^[A-Za-z0-9][A-Za-z0-9 _.\-]{1,23}$/;
const STATUS = { saved: "All progress saved", saving: "Saving…", pending: "Saving…", error: "Couldn’t save. Trying again soon." };
let saveTimer = 0, retryTimer = 0, dirty = false, pendingResult = null;

// A text/plain POST is a "simple" request, so the browser skips the CORS preflight Apps Script can't answer.
async function api(action, data, keepalive) {
  let res;
  try { res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ action }, data)), keepalive: !!keepalive }); }
  catch (e) { throw new Error("Couldn’t reach the score sheet. Check your connection and try again."); }
  let j; try { j = await res.json(); } catch (e) { throw new Error("The score sheet sent back something unexpected."); }
  if (!j || !j.ok) throw new Error((j && j.error) || "Something went wrong.");
  return j;
}
function toast(html) { const t = document.createElement("div"); t.className = "toast"; t.innerHTML = html; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function fmtDate(t) { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }

function paintAcct() {
  $("#acctWrap").hidden = !API_URL;
  if (!API_URL) return;
  $("#acctBtn").innerHTML = ACC.name
    ? `<span class="avatar">${esc(ACC.name[0].toUpperCase())}</span><span>${esc(ACC.name)}</span><span class="dot ${ACC.status}"></span>`
    : "Sign in";
}
function setStatus(st) { ACC.status = st; const d = $("#acctBtn .dot"); if (d) d.className = "dot " + st; const t = $("#acctStatus"); if (t) t.textContent = STATUS[st] || "Signed in"; }

function openLogin() {
  closePop();
  $("#modalSlot").innerHTML = `<div class="scrim" id="loginScrim"><form class="card" id="loginForm" role="dialog" aria-modal="true" novalidate>
    <h3>Save your progress</h3>
    <p>Type a username. A new name makes an account; a name you’ve used before signs you back in.</p>
    <label for="loginName">Username</label>
    <input id="loginName" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="24" placeholder="e.g. jake_l">
    <p class="err" id="loginErr" role="alert"></p>
    <p class="fine">No email or password. Anyone who types your username can use your account, so pick something only you would type.</p>
    <div class="btns"><button type="submit" class="btn primary" id="loginGo">Continue</button><button type="button" class="linkbtn" id="loginSkip">Not now</button></div>
  </form></div>`;
  const form = $("#loginForm"), input = $("#loginName"), err = $("#loginErr"), go = $("#loginGo");
  setTimeout(() => input.focus(), 60);
  input.addEventListener("input", () => (err.textContent = ""));
  const close = () => { $("#modalSlot").innerHTML = ""; };
  $("#loginSkip").onclick = () => { store.set("gk-login-seen", 1); close(); };
  $("#loginScrim").addEventListener("click", (e) => { if (e.target.id === "loginScrim") close(); });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = input.value.trim().replace(/\s+/g, " ");
    const fail = (m) => { err.textContent = m; form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake"); go.disabled = false; go.textContent = "Continue"; input.focus(); };
    if (!NAME_RE.test(name)) return fail("Use 2–24 letters or numbers. Spaces, dots, dashes and underscores are fine after the first character.");
    go.disabled = true; go.textContent = "Signing in…";
    try {
      const j = await api("login", { username: name });
      store.set("gk-login-seen", 1); close(); signedIn(j, true);
      toast(j.created ? `Account created. Welcome, ${esc(j.username)}!` : `Welcome back, ${esc(j.username)}`);
      if (pendingResult) { const r = pendingResult; pendingResult = null; saveResult(r); }
    } catch (ex) { fail(ex.message); }
  });
}
function signedIn(j, fresh) {
  ACC.name = j.username; ACC.level = j.level || 1; ACC.solved = j.solved || 0; ACC.fastest = j.fastest;
  store.set("gk-user", ACC.name); setStatus("saved"); paintAcct();
  // the account's furthest level unlocks here too
  const remote = j.progress && j.progress.state;
  PROG.max = Math.max(PROG.max, Math.min(TOTAL, ACC.level), remote && remote.v === 2 ? Math.min(TOTAL, remote.max || 1) : 1); saveProg();
  // pick up the account's unfinished level if this browser has nothing on the board
  if (remote && remote.v === 2 && remote.level >= 1 && remote.level <= TOTAL && !walls.size && !history.length) {
    DRAFTS[remote.level] = { walls: remote.walls || [], elapsed: remote.elapsed || 0, hints: remote.hints || 0 };
    loadLevel(remote.level);
    if (fresh && (remote.walls || []).length) toast(`Picked up level ${remote.level} where you left off`);
  } else if (!remote && !walls.size && !history.length && PROG.best[level] != null && unlocked(level + 1)) {
    loadLevel(Math.min(TOTAL, PROG.max));
  } else markDirty();
  paintStatus();
}
function signOut() {
  if (dirty) saveProgress();
  ACC.name = null; ACC.status = ""; store.del("gk-user"); closePop(); paintAcct(); toast("Signed out");
}
function closePop() { const p = $("#acctPop"); if (p && !p.hidden) { p.hidden = true; $("#acctBtn").setAttribute("aria-expanded", "false"); } }
async function openPop() {
  const pop = $("#acctPop");
  pop.innerHTML = `<h4>${esc(ACC.name)}</h4><p class="sub" id="acctStatus">${STATUS[ACC.status] || "Signed in"}</p>
    <div class="stats3"><div><span>Level</span><b>${Math.min(ACC.level, TOTAL)}</b></div><div><span>Solved</span><b>${ACC.solved}</b></div><div><span>Fastest</span><b>${ACC.fastest == null ? "–" : fmtTime(ACC.fastest)}</b></div></div>
    <p class="mini">Leaderboard</p><ul class="list" id="lb"><li><small>Loading…</small></li></ul>
    <p class="mini">Recent solves</p><ul class="list" id="hist"><li><small>Loading…</small></li></ul>
    <button class="linkbtn" id="signOutBtn">Sign out</button>`;
  pop.hidden = false; $("#acctBtn").setAttribute("aria-expanded", "true");
  $("#signOutBtn").onclick = signOut;
  try {
    const j = await api("history", { username: ACC.name });
    const h = $("#hist"), lb = $("#lb"); if (!h) return;
    h.innerHTML = j.results.length ? j.results.map((r) => `<li><span>Level ${Number(r.level)}<br><small>${fmtDate(r.time)} · ${Number(r.panes)} panes</small></span><span>${fmtTime(Number(r.seconds))}</span></li>`).join("")
      : "<li><small>No solved puzzles yet.</small></li>";
    lb.innerHTML = j.leaderboard.length ? j.leaderboard.map((u, i) => `<li class="${u.username.toLowerCase() === ACC.name.toLowerCase() ? "me" : ""}"><span>${i + 1}. ${esc(u.username)}</span><span>Level ${Math.min(Number(u.level), TOTAL)} <small>· ${Number(u.solved)} solved</small></span></li>`).join("")
      : "<li><small>Nobody yet. Be first!</small></li>";
  } catch (e) { const h = $("#hist"); if (h) h.innerHTML = `<li><small>${esc(e.message)}</small></li>`; const lb = $("#lb"); if (lb) lb.innerHTML = ""; }
}
$("#acctBtn").addEventListener("click", (e) => { e.stopPropagation(); if (!ACC.name) return openLogin(); if ($("#acctPop").hidden) openPop(); else closePop(); });
document.addEventListener("click", (e) => { if (!e.target.closest("#acctWrap")) closePop(); });

function markDirty() {
  if (!API_URL || !ACC.name) return;
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(saveProgress, 2000); setStatus("pending");
}
async function saveProgress(keepalive) {
  clearTimeout(saveTimer);
  if (!API_URL || !ACC.name || !dirty) return;
  dirty = false;
  const name = ACC.name, st = snapshotState();
  if (solvedFlag) { st.walls = []; st.elapsed = 0; st.hints = 0; }
  setStatus("saving");
  try { await api("progress", { username: name, state: st }, keepalive === true); if (!dirty && ACC.name === name) setStatus("saved"); }
  catch (e) { if (ACC.name !== name) return; dirty = true; setStatus("error"); clearTimeout(retryTimer); retryTimer = setTimeout(saveProgress, 15000); }
}
addEventListener("pagehide", () => { pauseTimer(); if (!solvedFlag) saveDraft(); if (dirty) saveProgress(true); });

async function saveResult(r) {
  const line = $("#saveLine");
  const show = (cls, html) => { if (line && line.isConnected) { line.className = "save-line " + cls; line.innerHTML = html; } };
  if (!API_URL) return;
  if (!ACC.name) {
    show("", `<button class="linkbtn" id="signToSave">Sign in to save this solve</button>`);
    const b = $("#signToSave"); if (b) b.onclick = () => { pendingResult = r; openLogin(); };
    return;
  }
  clearTimeout(saveTimer); dirty = false;
  show("", "Saving…");
  try {
    const j = await api("result", { username: ACC.name, result: r });
    ACC.level = j.level; ACC.solved = j.solved; ACC.fastest = j.fastest; setStatus("saved");
    show("good", "Saved to your account.");
    dirty = true; saveProgress();
  } catch (e) {
    show("bad", `${esc(e.message)} <button class="linkbtn" id="retrySave">Retry</button>`);
    const b = $("#retrySave"); if (b) b.onclick = () => saveResult(r);
  }
}
async function initAccounts() {
  paintAcct();
  if (!API_URL) return;
  if (ACC.name) { try { signedIn(await api("login", { username: ACC.name }), false); } catch (e) { setStatus("error"); } }
  else if (!store.get("gk-login-seen")) setTimeout(openLogin, 700);
}

/* ================= START ================= */
(function start() {
  store.del("gk-state"); store.del("gk-level"); // from the first version, whose boards were random
  saveProg();
  const cur = store.get("gk-current");
  loadLevel(unlocked(cur) ? cur : Math.min(TOTAL, PROG.max));
  setMode(mode);
  initAccounts();
})();

// hooks for automated tests
window.__game = { get s() { return { level, cells, P, walls, fixed, regions, evalState, CS, PAD, selection, PROG }; },
  loadLevel, setWalls(list) { walls = new Set(list.filter((e) => !fixed.has(e))); changed(); }, carve };
})();
</script>
